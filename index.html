<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수복이 만나기 D-day</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: transparent;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 30%, #ffd6d6 100%);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 
                0 20px 50px rgba(255, 182, 193, 0.3),
                0 0 30px rgba(255, 182, 193, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 3px solid rgba(255, 182, 193, 0.2);
            max-width: 520px;
            width: 90%;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .title {
            color: #2d3436;
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(255, 182, 193, 0.3);
        }
        
        .subtitle {
            color: #636e72;
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 35px;
            opacity: 0.8;
        }
        
        .countdown {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 240, 245, 0.9) 100%);
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 30px;
            border: 2px solid rgba(255, 182, 193, 0.3);
            box-shadow: 
                0 10px 30px rgba(255, 182, 193, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .countdown::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b9d, #c44569, #f8b500, #ff6b9d);
            border-radius: 25px;
            z-index: -1;
            animation: gradientShift 3s ease-in-out infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .days-number {
            font-size: 4.5rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 10px;
            animation: subtlePulse 3s ease-in-out infinite;
        }
        
        @keyframes subtlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        
        .days-text {
            font-size: 1.4rem;
            color: #636e72;
            font-weight: 400;
            margin-bottom: 25px;
        }
        
        .time-detail {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        
        .time-unit {
            text-align: center;
            color: #2d3436;
        }
        
        .time-number {
            font-size: 1.8rem;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }
        
        .time-label {
            font-size: 0.9rem;
            opacity: 0.7;
            font-weight: 300;
        }
        
        .pregnancy-info {
            background: linear-gradient(135deg, rgba(116, 185, 255, 0.15) 0%, rgba(163, 203, 255, 0.15) 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid rgba(116, 185, 255, 0.3);
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.1);
            position: relative;
        }
        
        .pregnancy-info::before {
            content: '🤱';
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        
        .weeks-info {
            color: #2d3436;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .weeks-number {
            font-weight: 700;
            color: #0984e3;
        }
        
        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(116, 185, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid rgba(116, 185, 255, 0.3);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #74b9ff, #0984e3, #74b9ff);
            background-size: 200% 100%;
            border-radius: 15px;
            transition: width 0.3s ease;
            animation: progressShine 2s ease-in-out infinite;
        }
        
        @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        

        .target-date {
            color: #636e72;
            font-size: 1rem;
            margin-top: 20px;
            font-weight: 300;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 35px 25px;
            }
            
            .title {
                font-size: 1.8rem;
            }
            
            .days-number {
                font-size: 3.5rem;
            }
            
            .time-detail {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .time-unit {
                flex: 1;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">수복이 만나기</h1>
        <p class="subtitle">우리 아기와의 첫 만남까지</p>
        
        <div class="pregnancy-info">
            <div class="weeks-info">
                현재 임신 <span class="weeks-number" id="currentWeeks">9</span>주 <span class="weeks-number" id="currentDays">2</span>일
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="countdown">
            <div class="days-number" id="days">0</div>
            <div class="days-text">일 남았어요</div>
            <div class="time-detail">
                <div class="time-unit">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">시간</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="minutes">00</span>
                    <span class="time-label">분</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">초</span>
                </div>
            </div>
        </div>
        
        <div class="target-date" id="targetDate"></div>
    </div>

    <script>
        // 출산 예정일: 2026년 2월 7일
        const targetDate = new Date(2026, 1, 7, 0, 0, 0);
        
        // 임신 시작일 계산 (9주 2일 전)
        const today = new Date();
        const pregnancyStart = new Date(today);
        pregnancyStart.setDate(today.getDate() - (9 * 7 + 2));
        
        // 목표 날짜 표시
        const options = { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            timeZone: 'Asia/Seoul'
        };
        document.getElementById('targetDate').textContent = 
            '출산 예정일: ' + targetDate.toLocaleDateString('ko-KR', options);
        
        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;
            
            // 현재 임신 주수 계산
            const daysSinceStart = Math.floor((now - pregnancyStart) / (1000 * 60 * 60 * 24));
            const currentWeeks = Math.floor(daysSinceStart / 7);
            const currentDays = daysSinceStart % 7;
            
            document.getElementById('currentWeeks').textContent = currentWeeks;
            document.getElementById('currentDays').textContent = currentDays;
            
            // 진행률 계산 (40주 기준)
            const progressPercentage = Math.min((currentWeeks / 40) * 100, 100);
            document.getElementById('progressFill').style.width = progressPercentage + '%';
            
            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            } else {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                
                // D-day가 되면 축하 메시지 표시
                document.querySelector('.title').textContent = '수복이가 태어났어요! 🎉';
                document.querySelector('.days-text').textContent = '축하해요!';
                document.querySelector('.subtitle').textContent = '우리 가족이 되었어요';
            }
        }
        
        // 카운트다운 업데이트
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
